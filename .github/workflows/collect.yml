# Runs the collector on GitHub's servers every hour.
name: Collect and alert

on:
  schedule:
    - cron: "7 * * * *"        # every hour at :07 (UTC)
  workflow_dispatch: {}         # adds a "Run workflow" button for manual runs

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m collector run
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_FROM: ${{ secrets.ALERT_FROM }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          SITE_URL: ${{ secrets.SITE_URL }}
          RELIEFWEB_APPNAME: ${{ secrets.RELIEFWEB_APPNAME }}
